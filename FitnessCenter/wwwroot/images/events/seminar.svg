<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Seminar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#2563D8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#2563D8"/>

  <g transform="translate(290,140)">
    <rect x="16" y="24" width="180" height="106" rx="8" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M56 60 L156 60 M56 92 L120 92" stroke="#2563D8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M106 130 L106 160 M62 168 L150 168" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
