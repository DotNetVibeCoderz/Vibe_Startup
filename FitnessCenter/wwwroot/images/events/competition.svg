<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Competition">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#E23B32" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E23B32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#E23B32"/>

  <g transform="translate(290,140)">
    <path d="M56 16 L164 16 L164 68 Q164 116 110 130 Q56 116 56 68 Z" fill="#E23B32"/>
    <path d="M56 30 L22 30 Q22 76 60 84 M164 30 L198 30 Q198 76 160 84" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="92" y="130" width="36" height="24" fill="#fff" fill-opacity=".9"/>
    <rect x="62" y="154" width="96" height="16" rx="4" fill="#fff"/>
  </g>
</svg>
