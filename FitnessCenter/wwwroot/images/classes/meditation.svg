<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Meditation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#1FA85C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1FA85C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#1FA85C"/>

  <g transform="translate(290,140)">
    <circle cx="106" cy="88" r="74" stroke="#1FA85C" stroke-width="4" stroke-opacity=".3" fill="none"/>
    <circle cx="106" cy="88" r="54" stroke="#1FA85C" stroke-width="5" stroke-opacity=".55" fill="none"/>
    <circle cx="106" cy="42" r="17" fill="#1FA85C"/>
    <path d="M62 140 Q106 96 150 140" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M78 106 L106 84 L134 106" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
