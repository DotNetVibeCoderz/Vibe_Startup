<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Aerobics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#1FA85C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1FA85C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#1FA85C"/>

  <g transform="translate(290,140)">
    <rect x="14" y="112" width="120" height="22" rx="6" fill="#fff" fill-opacity=".9"/>
    <rect x="34" y="134" width="18" height="26" rx="4" fill="#fff" fill-opacity=".45"/>
    <rect x="96" y="134" width="18" height="26" rx="4" fill="#fff" fill-opacity=".45"/>
    <circle cx="168" cy="30" r="18" fill="#1FA85C"/>
    <path d="M168 48 L168 100 L140 112 M168 100 L200 112" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M168 62 L134 44 M168 62 L206 46" stroke="#1FA85C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
