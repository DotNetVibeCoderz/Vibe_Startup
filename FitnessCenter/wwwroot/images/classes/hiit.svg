<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="HIIT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#E23B32" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E23B32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#E23B32"/>

  <g transform="translate(290,140)">
    <path d="M96 0 L44 88 L84 88 L64 168 L132 68 L90 68 Z" fill="#E23B32"/>
    <rect x="0" y="132" width="26" height="36" rx="3" fill="#fff" fill-opacity=".9"/>
    <rect x="34" y="112" width="26" height="56" rx="3" fill="#fff" fill-opacity=".45"/>
    <rect x="144" y="96" width="26" height="72" rx="3" fill="#fff" fill-opacity=".45"/>
    <rect x="178" y="126" width="26" height="42" rx="3" fill="#fff" fill-opacity=".9"/>
  </g>
</svg>
