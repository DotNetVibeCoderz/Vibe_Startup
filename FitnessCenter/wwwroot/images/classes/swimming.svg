<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Swimming">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#2563D8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#2563D8"/>

  <g transform="translate(290,140)">
    <circle cx="60" cy="46" r="18" fill="#2563D8"/>
    <path d="M22 96 L82 76 L140 96" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M6 126 Q40 108 74 126 T142 126 T210 126" stroke="#2563D8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M6 158 Q40 140 74 158 T142 158 T210 158" stroke="#2563D8" stroke-width="7" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
