<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Pilates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#1FA85C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1FA85C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#1FA85C"/>

  <g transform="translate(290,140)">
    <path d="M40 24 Q104 56 40 88 Q104 120 40 152" stroke="#1FA85C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="18" y1="24" x2="18" y2="152" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="120" y="52" width="96" height="16" rx="8" fill="#fff" fill-opacity=".9"/>
    <rect x="120" y="106" width="96" height="16" rx="8" fill="#fff" fill-opacity=".45"/>
    <circle cx="132" cy="87" r="9" fill="#1FA85C"/><circle cx="204" cy="87" r="9" fill="#1FA85C"/>
  </g>
</svg>
