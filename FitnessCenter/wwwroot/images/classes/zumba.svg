    <path d="M186 44 Q206 82 186 120" stroke="#F3C218" stroke-width="7" stroke-opacity=".7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M206 26 Q236 82 206 138" stroke="#F3C218" stroke-width="6" stroke-opacity=".4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
