<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Spinning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#2563D8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#2563D8"/>

  <g transform="translate(290,140)">
    <circle cx="72" cy="96" r="56" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="72" cy="96" r="10" fill="#2563D8"/>
    <path d="M72 40 L72 152 M16 96 L128 96 M32 56 L112 136 M112 56 L32 136" stroke="#2563D8" stroke-width="5" stroke-opacity=".7"/>
    <path d="M128 96 L172 96 L196 42" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="176" y="30" width="46" height="12" rx="6" fill="#2563D8"/>
  </g>
</svg>
