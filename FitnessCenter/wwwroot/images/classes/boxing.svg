<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Boxing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#E23B32" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E23B32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#E23B32"/>

  <g transform="translate(290,140)">
    <path d="M36 60 Q36 16 88 16 Q150 16 150 68 L150 116 Q150 154 108 154 L74 154 Q36 154 36 116 Z" fill="#E23B32"/>
    <path d="M150 62 Q192 58 192 88 Q192 116 150 112" fill="#E23B32" fill-opacity=".75"/>
    <path d="M36 96 L150 96" stroke="#0C0F16" stroke-width="7" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="60" y="152" width="66" height="20" rx="8" fill="#fff" fill-opacity=".85"/>
  </g>
</svg>
