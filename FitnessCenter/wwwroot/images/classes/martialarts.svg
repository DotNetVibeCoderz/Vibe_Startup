<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Martial Arts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B25"/><stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#E23B32" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E23B32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- rim plate -->
  <rect x="0" y="0" width="800" height="6" fill="#E23B32"/>

  <g transform="translate(290,140)">
    <rect x="10" y="72" width="200" height="26" rx="6" fill="#fff" fill-opacity=".9"/>
    <path d="M86 72 L134 98 M134 72 L86 98" stroke="#E23B32" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="88" y="64" width="44" height="42" rx="8" fill="#E23B32"/>
    <path d="M100 106 L88 164 M120 106 L134 164" stroke="#E23B32" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
